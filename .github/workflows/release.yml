name: release-runner
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: stimulsoft-runner-win-x64.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish runner/Stimulsoft.Runner.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - shell: pwsh
        run: Move-Item publish\Stimulsoft.Runner.exe publish\${{ matrix.asset }}
      - shell: pwsh
        run: |
          $hash = (Get-FileHash publish\${{ matrix.asset }} -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Out-File checksums.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.rid }}
          path: |
            publish/${{ matrix.asset }}
            checksums.txt
  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets }
      - run: find assets -type f -name checksums.txt -exec cat {} + | sort -k2 -u > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/**/stimulsoft-runner-*
            checksums.txt
